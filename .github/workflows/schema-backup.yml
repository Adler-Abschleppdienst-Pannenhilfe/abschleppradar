name: Supabase Schema-Backup

# Sichert einmal woechentlich den STRUKTUR-Stand der Datenbank
# (Tabellen, Funktionen, RLS-Policies, Trigger, Indizes, Cron-Jobs)
# nach backup/schema.sql und committet ihn.
#
# KEINE Daten, also auch keine Kundendaten (--schema-only).
#
# SICHERHEIT: Das Passwort steht NUR in PGPASSWORD und wird nie Teil
# eines Verbindungs-Strings. Grund: Dieses Repo ist oeffentlich, und
# eine fehlerhafte URI landet mit ihrem Inhalt in der Fehlermeldung
# und damit im Log. Host und Benutzer sind nicht geheim.
#
# Voraussetzung: Repository-Secret SUPABASE_DB_PASSWORD
# (nur das Passwort, nicht die ganze Adresse)

on:
  schedule:
    - cron: '17 4 * * 1'      # montags 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  PGHOST: aws-1-eu-central-1.pooler.supabase.com
  PGPORT: '5432'
  PGUSER: postgres.tgpabumwznytuplybejc
  PGDATABASE: postgres
  PGSSLMODE: require

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schema dumpen
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$PGPASSWORD" ]; then
            echo "FEHLER: Secret SUPABASE_DB_PASSWORD fehlt."
            exit 1
          fi
          mkdir -p backup

          PG="docker run --rm -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE
              -e PGPASSWORD -e PGSSLMODE postgres:17"

          # Struktur des public-Schemas
          $PG pg_dump --schema-only --schema=public \
                      --no-owner --no-privileges > backup/schema.sql

          # Cron-Jobs stehen als Zeilen in cron.job, die faengt pg_dump nicht
          {
            echo ""
            echo "-- ==================================================="
            echo "-- Cron-Jobs (Stand $(date -u +%F))"
            echo "-- ==================================================="
          } >> backup/schema.sql
          $PG psql -At -F" | " -c \
            "select jobid, jobname, schedule, active, command from cron.job order by jobid" \
            | sed 's/^/-- /' >> backup/schema.sql \
            || echo "-- (cron.job nicht lesbar)" >> backup/schema.sql

          echo "Zeilen im Dump: $(wc -l < backup/schema.sql)"

      - name: Sicherheitsnetz - keine Kundendaten im Dump
        run: |
          if [ ! -s backup/schema.sql ]; then
            echo "ABBRUCH: Dump ist leer."
            exit 1
          fi
          if grep -qiE '^(INSERT INTO|COPY .* FROM stdin)' backup/schema.sql; then
            echo "ABBRUCH: Der Dump enthaelt Daten, nicht nur Struktur."
            exit 1
          fi
          echo "OK - nur Struktur."

      - name: Committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup/schema.sql
          if git diff --staged --quiet; then
            echo "Keine Aenderung am Schema - nichts zu committen."
          else
            git commit -m "Schema-Backup $(date -u +%F)"
            git push
          fi
